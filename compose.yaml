# Optional local PostgreSQL only. These credentials are for local development.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jdiddles-dev-only
      POSTGRES_DB: jdiddles
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jdiddles"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
